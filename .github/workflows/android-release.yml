name: Android release
run-name: "Android release ${{ inputs.tag || github.ref_name }}"

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  FLUTTER_VERSION: '3.44.9'

jobs:
  build-and-publish:
    name: Build and publish APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Validate release tag and package version
        run: node scripts/verify-release-version.cjs "$RELEASE_TAG"

      - name: Configure optional release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          configured=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -n "${!name}" ]; then
              configured=$((configured + 1))
            fi
          done
          if [ "$configured" -eq 0 ]; then
            echo "::warning::No Android release keystore configured; using the debug keystore for this installable APK."
            echo "SIGNING_MODE=debug" >> "$GITHUB_ENV"
            {
              echo "### APK signing"
              echo "Debug keystore fallback (not suitable for Play Store publication or production updates)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$configured" -ne 4 ]; then
            echo "::error::Configure all four Android signing secrets, or remove all of them for debug signing."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-key.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release-key.jks
          EOF
          echo "SIGNING_MODE=release" >> "$GITHUB_ENV"
          {
            echo "### APK signing"
            echo "Configured Android release keystore."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter sources
        run: flutter analyze

      - name: Run regression tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK signature and create checksum
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk"
          mkdir -p release
          cp "$apk" "release/snorer-${RELEASE_TAG}.apk"
          sha256sum "release/snorer-${RELEASE_TAG}.apk" > "release/snorer-${RELEASE_TAG}.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: snorer-${{ env.RELEASE_TAG }}
          path: release/
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Snorer $RELEASE_TAG" \
            --generate-notes \
            release/snorer-${RELEASE_TAG}.apk \
            release/snorer-${RELEASE_TAG}.apk.sha256
