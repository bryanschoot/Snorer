name: snorer
description: "Offline-first sleep recording and local sound analysis for Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_foreground_task: ^10.0.0
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  record: ^7.1.1
  shared_preferences: ^2.5.5
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/yamnet_classification.tflite
